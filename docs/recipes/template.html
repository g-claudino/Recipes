<!--
  Copy this file to start a new recipe: cp docs/recipes/template.html docs/recipes/my-recipe.html
  Then:
    1. Set <body class="cat-entries|cat-mains|cat-desserts"> to match the
       category you're filing this under -- it colors the grid lines,
       stage labels, and breadcrumb to match.
    2. Swap the hero <img> and thumbnail src for a real photo once you
       have one (any size -- object-fit covers it). Until then the
       category placeholder in assets/images/ works as a stand-in.
    3. Add a <li class="card-link"> for it to the matching category page
       in docs/categories/, and bump that category's count on
       docs/index.html.

  The table is the grid, same mechanics as recipes/TEMPLATE.tex:
    - A rowspan="N" cell spans N rows down that column; every row it
      covers after the first must skip that <td> entirely.
    - A colspan="N" cell spans N columns across (used for the
      pan-prep / oven-preheat banner rows).
  Add or remove ingredient rows or stage columns freely -- just keep
  each rowspan in sync with how many rows it actually covers, and
  keep colspan equal to the total number of columns.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Name</title>
<script src="../assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="cat-entries">
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<main>
  <nav class="crumbs"><a href="../index.html">Recipes</a> / <a href="../categories/entries.html">Entries</a> / Recipe Name</nav>

  <div class="recipe-hero">
    <img src="../assets/images/placeholder-entries.svg" alt="Recipe Name">
  </div>

  <header class="recipe-header">
    <h1>Recipe Name</h1>
    <p class="meta">Yield <span class="sep">&bull;</span> Active time</p>
  </header>

  <div class="grid-wrap">
    <table class="recipe-grid">
      <tr>
        <td class="banner" colspan="5">Prep the pan / preheat the oven</td>
      </tr>
      <tr>
        <td class="ingredient">Ingredient one</td>
        <td class="stage">melt</td>
        <td></td>
        <td></td>
        <td class="stage bake" rowspan="4">bake<br>350&deg;F<br>XX min</td>
      </tr>
      <tr>
        <td class="ingredient">Ingredient two</td>
        <td></td>
        <td class="stage" rowspan="2">mix</td>
        <td></td>
      </tr>
      <tr>
        <td class="ingredient">Ingredient three</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td class="ingredient">Ingredient four</td>
        <td></td>
        <td></td>
        <td class="stage">fold in</td>
      </tr>
    </table>
  </div>

  <a class="back-link" href="../categories/entries.html">&larr; Entries</a>
</main>
</body>
</html>
